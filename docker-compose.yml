# portfolio 로컬 개발용 PostgreSQL
# 스키마와 seed 데이터는 sqlfiles/bootstrap.sh로 구성한다.
services:
  redis:
    image: redis:7.4-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
