# =====================================================================
# hanacard 로컬 개발용 PostgreSQL
#
# 이 파일이 하는 일: "모두가 똑같은 빈 PostgreSQL을 갖게" 한다.
#   데이터는 공유되지 않는다 — 각자 자기 컨테이너에 자기 DB가 생긴다.
#   스키마·데이터는 sqlfiles 번들(README 참고)로 각자 구축한다.
#
# 사용:
#   docker compose up -d db      # 기동
#   docker compose ps            # healthy 확인 후 다음 단계 진행
#   docker compose down          # 중지 (데이터는 볼륨에 유지됨)
#   docker compose down -v       # 볼륨까지 삭제 = DB 완전 초기화
#
# 기동 후 절차는 sqlfiles/README.md 참고:
#   역할 3개 생성 → V001 → bootstrap.sh
#   (POSTGRES_DB로 hanacard가 자동 생성되므로 createdb 단계는 불필요)
#
# ⚠️ 로컬에 PostgreSQL을 직접 설치해 쓰고 있다면 이 파일은 쓰지 않아도 된다.
#    5432 포트가 충돌하면 .env의 POSTGRES_PORT를 5433 등으로 바꿀 것.
#
# ⚠️ 컨테이너는 scram-sha-256 인증을 쓴다(직접 설치한 PostgreSQL의 trust와 다름).
#    즉 .env에 적힌 비밀번호와 CREATE ROLE 시 지정한 비밀번호가 실제로 일치해야
#    접속된다. 불일치하면 "password authentication failed"가 난다.
# =====================================================================

services:
  db:
    # PostgreSQL 17 고정 — sqlfiles의 DDL이 17 기준으로 작성·검증되었다.
    # 팀원마다 다른 메이저 버전을 쓰면 "내 PC에선 되는데" 문제의 원인이 된다.
    image: postgres:17-alpine
    container_name: hanacard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 .env에 필요합니다}
      # 컨테이너 최초 기동 시 이 이름으로 DB가 자동 생성된다 → createdb 불필요
      POSTGRES_DB: ${POSTGRES_DB:-hanacard}
      TZ: UTC
      PGTZ: UTC

    # 타임존 고정: TIMESTAMPTZ 값은 UTC로 저장되지만 세션 타임존에 따라 표시가
    # 달라진다. 팀원마다 다르면 EXTRACT(HOUR) 결과가 흔들려 시간대 기반 분석이
    # 환경마다 달라지므로 서버 레벨에서 고정한다(V001의 ALTER DATABASE와 이중 방어).
    command: ["postgres", "-c", "timezone=UTC"]

    ports:
      # 호스트에서 localhost:${POSTGRES_PORT}로 접속. 백엔드는 컨테이너가 아니라
      # 호스트에서 직접 실행하며 이 포트로 붙는다.
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # 데이터는 named volume에 보존된다. down 해도 유지되고, down -v로만 삭제된다.
      - postgres_data:/var/lib/postgresql/data
      # 스키마 초기화 스크립트는 여기에 마운트하지 않는다(의도):
      #   /docker-entrypoint-initdb.d는 파일명 알파벳 순으로 실행되어
      #   V010이 V002보다 먼저 오는 등 순서가 깨지고, 볼륨이 비어있을 때 단 한 번만
      #   실행되어 재실행·검증이 어렵다. 실행 순서는 sqlfiles/bootstrap.sh가 관리한다.

    healthcheck:
      # 컨테이너가 "떴다"와 "접속 가능하다"는 다르다. bootstrap 실행 전
      # docker compose ps에서 healthy를 확인할 것.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hanacard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
