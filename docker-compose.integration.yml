services:
  integration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: integration-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d portfolio"]
      interval: 2s
      timeout: 3s
      retries: 20

  integration-redis:
    image: redis:7.4-alpine

  integration-api:
    build: .
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio
      PORTFOLIO_APP_DATABASE_URL: postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio
      PORTFOLIO_AGENT_DATABASE_URL: postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio
      PORTFOLIO_MIGRATION_DATABASE_URL: postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio
      JWT_SECRET: integration-jwt-secret-at-least-32-bytes-long-2026
      CELERY_BROKER_URL: redis://integration-redis:6379/0
      CELERY_RESULT_BACKEND: redis://integration-redis:6379/1
      WORKER_STATUS_REDIS_URL: redis://integration-redis:6379/2
      CORS_ALLOWED_ORIGINS: '["http://localhost:3001"]'
    command: >-
      sh -c 'python -m scripts.prepare_test_database
      && alembic upgrade head
      && python -m scripts.seed_test_admin
      && python -m scripts.seed_frontend_e2e_data
      && gunicorn app.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000'
    ports:
      - "8001:8000"
    depends_on:
      integration-db:
        condition: service_healthy
      integration-redis:
        condition: service_started

  integration-frontend:
    build:
      context: ../Frontend_2
      args:
        VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "3001:80"
    depends_on:
      - integration-api
