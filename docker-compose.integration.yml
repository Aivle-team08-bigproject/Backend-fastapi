services:
  integration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: integration-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d portfolio"]
      interval: 2s
      timeout: 3s
      retries: 20

  integration-redis:
    image: redis:7.4-alpine

  integration-api:
    build: .
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio
      PORTFOLIO_APP_DATABASE_URL: postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio
      # 에이전트는 공용 Neon의 메타데이터/원본을 조회한다. 통합 기동 스크립트는
      # Neon에 스키마 초기화나 seed를 실행하지 않는다.
      PORTFOLIO_AGENT_DATABASE_URL: ${PORTFOLIO_AGENT_DATABASE_URL:-postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio}
      PORTFOLIO_MIGRATION_DATABASE_URL: postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio
      JWT_SECRET: integration-jwt-secret-at-least-32-bytes-long-2026
      CELERY_BROKER_URL: redis://integration-redis:6379/0
      CELERY_RESULT_BACKEND: redis://integration-redis:6379/1
      WORKER_STATUS_REDIS_URL: redis://integration-redis:6379/2
      CORS_ALLOWED_ORIGINS: '["http://localhost:3001"]'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DATA_ANONYMIZATION_KEY: ${DATA_ANONYMIZATION_KEY:-}
    command: gunicorn app.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    ports:
      - "8001:8000"
    depends_on:
      integration-db:
        condition: service_healthy
      integration-redis:
        condition: service_started

  integration-worker:
    build: .
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio
      PORTFOLIO_APP_DATABASE_URL: postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio
      PORTFOLIO_AGENT_DATABASE_URL: ${PORTFOLIO_AGENT_DATABASE_URL:-postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio}
      PORTFOLIO_MIGRATION_DATABASE_URL: postgresql+psycopg://appuser:integration-password@integration-db:5432/portfolio
      JWT_SECRET: integration-jwt-secret-at-least-32-bytes-long-2026
      CELERY_BROKER_URL: redis://integration-redis:6379/0
      CELERY_RESULT_BACKEND: redis://integration-redis:6379/1
      WORKER_STATUS_REDIS_URL: redis://integration-redis:6379/2
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DATA_ANONYMIZATION_KEY: ${DATA_ANONYMIZATION_KEY:-}
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=INFO --concurrency=1
    depends_on:
      integration-api:
        condition: service_started
      integration-db:
        condition: service_healthy
      integration-redis:
        condition: service_started

  integration-frontend:
    build:
      context: ../Frontend_2
      args:
        VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "3001:80"
    depends_on:
      - integration-api
