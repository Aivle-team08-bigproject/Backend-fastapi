# PostgreSQL은 NeonDB(관리형)를 사용한다 — 이 파일은 DB를 띄우지 않는다.
# 스키마·역할·권한은 NeonDB에 이미 구성돼 있고, 접속 정보는 .env의 세 DB URL로 주입한다.
services:
  redis:
    image: redis:7.4-alpine
    container_name: hanacard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: hanacard-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WORKER_STATUS_REDIS_URL: redis://redis:6379/2
      UPLOAD_ROOT: /app/uploads
      PIPELINE_QUERY_SOURCE: ${PIPELINE_QUERY_SOURCE:-csv}
    volumes:
      - uploaded_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    container_name: hanacard-celery-worker
    restart: unless-stopped
    env_file: .env
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WORKER_STATUS_REDIS_URL: redis://redis:6379/2
      UPLOAD_ROOT: /app/uploads
      PIPELINE_QUERY_SOURCE: ${PIPELINE_QUERY_SOURCE:-csv}
      # Celery prefork 워커는 부모 프로세스를 fork 해서 자식을 만든다. 부모가
      # 커넥션을 연 채 fork 되면 자식들이 같은 소켓을 공유해 요청·응답이 뒤섞인다.
      # 워커는 태스크마다 열고 닫는 편이 안전하고, 유휴 커넥션도 남지 않는다.
      DB_USE_NULL_POOL: "true"
      # 단계 에이전트(agent_runtime/)가 이 worker 안에서 돌기 때문에 필요한 설정.
      # data_processing/processor.py가 식별자 가명화 키와 파일 경로 제한에 쓴다.
      DATA_ANONYMIZATION_KEY: ${DATA_ANONYMIZATION_KEY:-}
      DATA_RETRIEVAL_ALLOWED_ROOT: /data
      DATA_RETRIEVAL_OUTPUT_ROOT: /data/jobs
    volumes:
      - uploaded_data:/app/uploads
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  uploaded_data:
  redis_data:
