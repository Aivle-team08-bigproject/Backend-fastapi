services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d portfolio"]
      interval: 2s
      timeout: 3s
      retries: 20

  test-redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend-tests:
    build:
      context: .
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://appuser:test-password@test-db:5432/portfolio
      PORTFOLIO_APP_DATABASE_URL: postgresql+psycopg://appuser:test-password@test-db:5432/portfolio
      PORTFOLIO_AGENT_DATABASE_URL: postgresql+psycopg://appuser:test-password@test-db:5432/portfolio
      PORTFOLIO_MIGRATION_DATABASE_URL: postgresql+psycopg://appuser:test-password@test-db:5432/portfolio
      JWT_SECRET: test-only-jwt-secret-at-least-32-bytes-long-2026
      BOOTSTRAP_ADMIN_PASSWORD: TestAdmin!2026Secure
      BOOTSTRAP_ADMIN_ID: DEMO-ADMIN-001
      BOOTSTRAP_ADMIN_EMAIL: admin@company.com
      ALLOWED_EMAIL_DOMAINS: company.com
      CELERY_TASK_ALWAYS_EAGER: "true"
      CELERY_BROKER_URL: redis://test-redis:6379/0
      CELERY_RESULT_BACKEND: redis://test-redis:6379/1
      WORKER_STATUS_REDIS_URL: redis://test-redis:6379/2
    command: >-
      sh -c 'python -m scripts.prepare_test_database
      && alembic upgrade head
      && python -m scripts.seed_test_admin
      && python -m scripts.seed_frontend_e2e_data
      && python -m scripts.verify_frontend_e2e_data
      && python -m pytest -q tests/test_dashboard_contract.py tests/test_dashboard_api.py tests/test_dashboard_auth.py tests/test_dashboard_v2_contract.py'
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
